{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card p-4" style="background:var(--card);border-color:var(--border);">
      <h3 class="text-center mb-4">إنشاء حساب جديد</h3>
      <form method="POST">
        <input name="username" class="form-control mb-3" placeholder="اسم المستخدم (4 أحرف على الأقل)"
               minlength="4" required style="background:var(--bg);color:var(--text);border-color:var(--border);">
        <input name="password" type="password" class="form-control mb-3" placeholder="كلمة المرور (9 أحرف على الأقل)"
               minlength="9" required style="background:var(--bg);color:var(--text);border-color:var(--border);">
        <button class="btn-gold w-100">تسجيل</button>
      </form>
      <p class="text-center mt-3" style="color:var(--muted);font-size:14px;">
        لديك حساب؟ <a href="/login" style="color:var(--accent);">سجّل الدخول</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
